<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}EBM Analyzer{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/tailwind.css">

  <!-- PWA: installable as a standalone app, works air-gapped once loaded -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EBM Analyzer">
  <style>
    /* Highlight styles for GOP annotations in report text */
    .gop-highlight {
      cursor: pointer;
      border-radius: 2px;
      padding: 1px 0;
      border-bottom: 2px solid transparent;
      transition: opacity 0.15s;
    }
    .gop-highlight:hover { opacity: 0.8; filter: brightness(0.95); }
    .gop-highlight.rejected { opacity: 0.4; text-decoration: line-through; }

    /* Status badges */
    .badge-vorgeschlagen { background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }
    .badge-akzeptiert    { background: #D1FAE5; color: #065F46; border: 1px solid #10B981; }
    .badge-abgelehnt     { background: #FEE2E2; color: #7F1D1D; border: 1px solid #EF4444; }

    /* Sidebar transitions */
    .sidebar-item { transition: all 0.15s ease; }
    .sidebar-item:hover { background: rgba(255,255,255,0.1); }
    .sidebar-item.active { background: rgba(255,255,255,0.15); border-left: 3px solid #fff; }

    /* Loading spinner */
    .spinner {
      border: 3px solid #e5e7eb;
      border-top: 3px solid #0ea5e9;
      border-radius: 50%;
      width: 24px; height: 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile drawer sidebar: off-canvas by default below the md breakpoint,
       slides in as an overlay. From md upward it reverts to a normal
       always-visible column (see the md: utility classes on #sidebar). */
    #sidebar {
      transition: transform 0.2s ease-in-out;
      transform: translateX(-100%);
    }
    #sidebar.sidebar-open { transform: translateX(0); }
    @media (min-width: 768px) {
      #sidebar { transform: none !important; }
    }
  </style>
  <script src="/static/js/i18n.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

<div class="flex h-screen overflow-hidden relative">

  <!-- Mobile-only backdrop, closes the drawer when tapped outside it -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="closeSidebar()"></div>

  <!-- Sidebar navigation: off-canvas drawer on mobile, static column from md up -->
  <aside class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-slate-800 text-white flex flex-col flex-shrink-0" id="sidebar">
    <div class="p-5 border-b border-slate-700 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-sky-500 rounded-lg flex items-center justify-center font-bold text-lg">E</div>
        <div>
          <div class="font-semibold text-sm leading-tight">EBM Analyzer</div>
          <div class="text-xs text-slate-400">Sovereign AI Stack</div>
        </div>
      </div>
      <button onclick="closeSidebar()" class="md:hidden text-slate-400 hover:text-white p-1" aria-label="Menü schließen">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="flex-1 p-3 space-y-1 overflow-y-auto" id="sidebar-nav">
      <a href="/dashboard" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'dashboard' %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7h18M3 12h18M3 17h18"/></svg>
        <span data-i18n="nav.dashboard">Dashboard</span>
      </a>
      <a href="/analyse" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'analyse' %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span data-i18n="nav.analysis">Analyse</span>
      </a>
      <a href="/patienten" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'patienten' %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span data-i18n="nav.patients">Patienten</span>
      </a>
      <a href="/fallakten" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'fallakten' %}active{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
        <span data-i18n="nav.cases">Fallakten</span>
      </a>
      <div id="admin-nav-item" class="hidden">
        <div class="mt-3 mb-1 px-3 text-xs text-slate-500 uppercase tracking-wider" data-i18n="nav.administration">Administration</div>
        <a href="/admin" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {% if active_page == 'admin' %}active{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span data-i18n="nav.user_management">Benutzerverwaltung</span>
        </a>
      </div>
    </nav>

    <div class="p-3 border-t border-slate-700">
      <!-- Language switcher -->
      <div class="px-3 mb-2">
        <select id="locale-picker"
          class="w-full bg-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 border border-slate-600 focus:outline-none focus:ring-1 focus:ring-sky-500 cursor-pointer">
          <option value="de">🇩🇪 Deutsch</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>

      <div class="flex items-center gap-3 px-3 py-2">
        <a href="/profil" class="w-8 h-8 bg-slate-600 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0" id="user-avatar" data-i18n-title="nav.profile" title="Profil">?</a>
        <a href="/profil" class="flex-1 min-w-0">
          <div class="text-sm font-medium truncate" id="user-name" data-i18n="common.loading">Laden...</div>
          <div class="text-xs text-slate-400 truncate" id="user-email"></div>
        </a>
        <button onclick="logout()" class="text-slate-400 hover:text-white flex-shrink-0" data-i18n-title="nav.logout" title="Abmelden">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
      <div id="system-status" class="mt-2 flex items-center gap-1.5 px-3 text-xs text-slate-400">
        <div class="w-2 h-2 rounded-full bg-slate-500" id="status-dot"></div>
        <span id="status-text" data-i18n="nav.checking_system">Prüfe System...</span>
      </div>
    </div>
  </aside>

  <!-- Right column: mobile top bar + main content -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Mobile-only top bar with hamburger toggle (sidebar is off-canvas below md) -->
    <div class="md:hidden flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-200 flex-shrink-0">
      <button onclick="openSidebar()" class="text-gray-600 p-1 -ml-1" aria-label="Menü öffnen">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-6 h-6 bg-sky-500 rounded-md flex items-center justify-center font-bold text-xs flex-shrink-0 text-white">E</div>
        <span class="font-semibold text-sm text-gray-900 truncate">EBM Analyzer</span>
      </div>
    </div>

    <main class="flex-1 overflow-y-auto">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script>
// ─── Auth helpers ────────────────────────────────────────────────────
// Session identity lives in an httpOnly cookie (ebm_session) set by the
// server on login — it is never readable or settable from JavaScript.
// credentials: 'same-origin' makes the browser attach it automatically.

async function apiCall(method, path, body = null) {
  // Ensure the message catalog is loaded before any post-API rendering,
  // so render functions can safely call t() for dynamic strings.
  await I18N.ready;
  const opts = {
    method,
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch('/api' + path, opts);
  if (resp.status === 401) { window.location.href = '/login'; return null; }
  return resp;
}

async function logout() {
  await apiCall('POST', '/auth/logout');
  window.location.href = '/login';
}

// ─── Mobile sidebar drawer ─────────────────────────────────────────────
function openSidebar() {
  document.getElementById('sidebar').classList.add('sidebar-open');
  document.getElementById('sidebar-backdrop').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('sidebar-open');
  document.getElementById('sidebar-backdrop').classList.add('hidden');
  document.body.style.overflow = '';
}
// Tapping a nav link on mobile should close the drawer, not leave it open
// behind the page that just navigated away.
document.getElementById('sidebar-nav').addEventListener('click', (e) => {
  if (e.target.closest('a')) closeSidebar();
});

// ─── PWA: register the service worker (static-asset caching only) ─────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js').catch(() => { /* non-critical */ });
  });
}

// ─── Current user info (sidebar footer) ──────────────────────────────
async function loadUserInfo() {
  const resp = await apiCall('GET', '/auth/me');
  if (!resp || !resp.ok) { window.location.href = '/login'; return; }
  const user = await resp.json();
  localStorage.setItem('ebm_user', JSON.stringify(user));
  document.getElementById('user-name').textContent = user.full_name;
  document.getElementById('user-email').textContent = user.email;
  document.getElementById('user-avatar').textContent = user.full_name.charAt(0).toUpperCase();
  if (user.role === 'admin') {
    document.getElementById('admin-nav-item').classList.remove('hidden');
  }
}

// ─── System status indicator ─────────────────────────────────────────
async function checkSystemStatus() {
  try {
    const resp = await apiCall('GET', '/system/status');
    if (!resp) return;
    const data = await resp.json();
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    if (data.status === 'ok') {
      dot.className = 'w-2 h-2 rounded-full bg-green-400';
      txt.textContent = t('nav.all_services_ok');
    } else {
      dot.className = 'w-2 h-2 rounded-full bg-yellow-400';
      txt.textContent = t('nav.services_degraded');
    }
  } catch { /* non-critical, ignore */ }
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.location.pathname !== '/login') {
    loadUserInfo();
    checkSystemStatus();
  }
});
</script>

{% block scripts %}{% endblock %}
</body>
</html>
